<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإيداع والسحب</title>
  <link rel="stylesheet" href="css/deposit.css">
</head>
<body>
  <div class="container">
    <h1>خدمات الإيداع والسحب</h1>
    
    <div class="balance-box">
      <h2>رصيدك الحالي:</h2>
      <p id="balance">0 جنيه</p>
    </div>

    <form id="transactionForm">
      <label for="amount">المبلغ:</label>
      <input type="number" id="amount" placeholder="أدخل المبلغ" required>

      <div class="buttons">
        <button type="button" id="depositBtn">إيداع</button>
        <button type="button" id="withdrawBtn">سحب</button>
      </div>
    </form>

    <div class="history">
      <h3>سجل العمليات</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="js/deposit.js"></script>
</body>
</html>
